name: Claude (shared)

# Reusable @claude responder, called from each repository's
# .github/workflows/claude.yml (template: templates/workflows/). Mention
# @claude in a pull request or issue comment to have Claude make a change, for
# example "@claude fix the open Claude Review findings". Only people with
# write access can trigger it. Claude pushes as the Claude GitHub App, so its
# commits start CI and Claude Review again.

on:
  workflow_call:
    inputs:
      node_version:
        type: string
        default: "22"
      model:
        type: string
        default: claude-sonnet-5-5
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ inputs.node_version }}

      - name: Enable pnpm and yarn
        run: corepack enable

      - name: Run Claude
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns 100
            --allowedTools "Bash(npm ci:*),Bash(npm install:*),Bash(npm run:*),Bash(npm test:*),Bash(pnpm install:*),Bash(pnpm run:*),Bash(pnpm test:*),Bash(pnpm -r:*),Bash(pnpm --filter:*),Bash(yarn install:*),Bash(yarn run:*),Bash(yarn test:*),Bash(git diff:*),Bash(git log:*),Bash(git status:*)"
            --append-system-prompt "Follow AGENTS.md and REVIEW.md. When asked to fix Claude Review findings, read every open comment containing <!-- claude-review --> on the PR, fix each 🔴 finding, and fix 🟡 findings only when the fix is small and plainly correct. Install dependencies with the package manager the lockfile shows (npm ci --ignore-scripts, pnpm install --frozen-lockfile, or yarn install --frozen-lockfile), run the checks AGENTS.md names for each package you touch, and push only when they pass. Reply on each 🔴 thread with what changed, or why it was not changed."
