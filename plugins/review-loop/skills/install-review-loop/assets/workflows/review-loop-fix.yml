name: Review Loop Fix

# Review Loop (Full), part 2 of 2: fixes one pull request head and pushes as
# the Claude GitHub App. Started by review-loop.yml, or by hand from Actions.
# The pipeline lives in gocougs2020/claude-plugins.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
      sha:
        description: Head commit the findings are on
        required: true
      branch:
        description: Pull request head branch
        required: true
      round:
        description: Fix round number
        required: false
        default: "1"

jobs:
  # Keep this job id: the gate ignores checks whose name starts with review-loop.
  review-loop-fix:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
      actions: read
      id-token: write
    uses: gocougs2020/claude-plugins/.github/workflows/review-loop-fix.yml@v1
    with:
      pr: ${{ inputs.pr }}
      sha: ${{ inputs.sha }}
      branch: ${{ inputs.branch }}
      round: ${{ inputs.round }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
