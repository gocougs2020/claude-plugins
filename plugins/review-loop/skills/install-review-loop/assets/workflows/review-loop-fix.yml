name: Review Loop Fix

# Thin caller for the shared fixer (gocougs2020/claude-plugins/.github/workflows/review-loop-fix.yml).
# Review Loop starts it; you can also run it by hand from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
      sha:
        description: Head commit the findings are on
        required: true
      branch:
        description: Pull request head branch
        required: true
      round:
        description: Fix round number
        required: false
        default: "1"

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read
  actions: read
  id-token: write

jobs:
  fix:
    uses: gocougs2020/claude-plugins/.github/workflows/review-loop-fix.yml@main
    with:
      pr: ${{ inputs.pr }}
      sha: ${{ inputs.sha }}
      branch: ${{ inputs.branch }}
      round: ${{ inputs.round }}
      node_version: "22"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
