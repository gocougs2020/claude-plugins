name: Review Loop

# Review Loop (Full), part 1 of 2: starts review-loop-fix.yml when a ready
# pull request's reviews and checks finish with something to fix. The pipeline
# lives in gocougs2020/claude-plugins. Works only from the default branch.

on:
  workflow_run:
    # Claude Review plus the name: of each CI workflow in this repository.
    workflows: ["Claude Review", "Verification"]
    types: [completed]
  check_run:
    types: [completed]
  pull_request_review:
    types: [submitted]

concurrency:
  group: review-loop-${{ github.event.pull_request.number || github.event.check_run.pull_requests[0].number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false

jobs:
  # Keep this job id: the gate ignores checks whose name starts with review-loop.
  review-loop:
    permissions:
      contents: read
      pull-requests: read
      checks: read
      issues: write
      actions: write
    uses: gocougs2020/claude-plugins/.github/workflows/review-loop-gate.yml@v1
