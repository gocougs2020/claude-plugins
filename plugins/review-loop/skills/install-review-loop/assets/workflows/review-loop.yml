name: Review Loop

# Thin caller for the shared Review Loop gate (gocougs2020/claude-plugins/.github/workflows/review-loop.yml).
# Works only once it is on the default branch, because workflow_run and
# check_run use the default branch's copy.

on:
  workflow_run:
    # "Claude Review" plus the name: of each CI workflow in this repository.
    workflows: ["Claude Review", "Verification"]
    types: [completed]
  check_run:
    types: [completed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read
  checks: read
  issues: write
  actions: write

jobs:
  gate:
    uses: gocougs2020/claude-plugins/.github/workflows/review-loop.yml@main
