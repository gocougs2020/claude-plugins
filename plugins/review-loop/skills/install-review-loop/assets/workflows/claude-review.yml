name: Claude Review

# Thin caller. The review itself lives in gocougs2020/claude-plugins/.github/workflows/claude-review.yml,
# so improving it there updates every repository at once.
# Required check name: "review / review".

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: gocougs2020/claude-plugins/.github/workflows/claude-review.yml@main
    # with:
    #   model: claude-haiku-5-5   # cheaper, shallower; default is claude-sonnet-5-5
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
