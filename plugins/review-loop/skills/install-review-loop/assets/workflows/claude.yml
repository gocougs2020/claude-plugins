name: Claude

# Comment @claude on a pull request or issue to have Claude make a change.
# The pipeline lives in gocougs2020/claude-plugins.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: gocougs2020/claude-plugins/.github/workflows/claude-mention.yml@v1
    with:
      node_version: "22"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
