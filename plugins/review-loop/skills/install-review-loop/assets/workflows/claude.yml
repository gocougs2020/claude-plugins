name: Claude

# Mention @claude in a pull request or issue comment to have Claude make a
# change, for example "@claude fix the open Claude Review findings". Only
# people with write access can trigger it. Claude pushes as the Claude GitHub
# App, so its commits start Verification and Claude Review again.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable pnpm and yarn
        run: corepack enable

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 100
            --allowedTools "Bash(npm ci:*),Bash(npm install:*),Bash(npm run:*),Bash(npm test:*),Bash(pnpm install:*),Bash(pnpm run:*),Bash(pnpm test:*),Bash(pnpm -r:*),Bash(pnpm --filter:*),Bash(yarn install:*),Bash(yarn run:*),Bash(yarn test:*),Bash(git diff:*),Bash(git log:*),Bash(git status:*)"
            --append-system-prompt "Follow AGENTS.md and REVIEW.md. When asked to fix Claude Review findings, read every open comment containing <!-- claude-review --> on the PR, fix each 🔴 finding, and fix 🟡 findings only when the fix is small and plainly correct. Install dependencies with the package manager the lockfile shows (npm ci --ignore-scripts, pnpm install --frozen-lockfile, or yarn install --frozen-lockfile), run the checks AGENTS.md names for each package you touch, and push only when they pass. Reply on each 🔴 thread with what changed, or why it was not changed."
